-- Tentativa de inserir produto 7 falha.`,question:"Qual sequência garante que o pedido válido continue, sem o brinde?",choices:[{label:"A",text:"Executar ROLLBACK e depois COMMIT."},{label:"B",text:"Executar COMMIT mesmo com a transação em erro, sem tratamento."},{label:"C",text:"Executar ROLLBACK TO SAVEPOINT antes_brinde; e então COMMIT."},{label:"D",text:"Iniciar outra transação dentro da transação para o brinde."}],correct:2,why:"ROLLBACK TO SAVEPOINT reverte apenas os comandos após o ponto de salvamento e permite continuar a transação. No PostgreSQL, após um erro SQL, é preciso voltar ao savepoint para recuperar o estado da transação.",hints:["O pedido principal já foi gravado na transação. Evite desfazê-lo.","Qual comando reverte apenas uma parte da transação?"],token:"ATOMICIDADE",skills:["BEGIN / COMMIT","SAVEPOINT","ROLLBACK"],consequence:"O pedido foi confirmado sem o brinde. O cliente não perdeu a compra."},{id:2,title:"O estoque duplicado",subtitle:"Concorrência e isolamento",icon:"⌁",duration:11,context:"Duas sessões vendem o mesmo teclado. O estoque começa em 10. Ambas consultam o saldo antes de atualizar.",objective:"Identifique a atualização perdida e decida como evitá-la.",evidence:`-- Sessão A       -- Sessão B

COMMIT;           COMMIT;`,question:"Após as duas vendas, que valor ficou no estoque e qual correção é adequada?",choices:[{label:"A",text:"Ficou 9; SELECT FOR UPDATE na transação ou UPDATE atômico evita a perda."},{label:"B",text:"Ficou 8; basta continuar usando SET estoque = 9."},{label:"C",text:"Ficou 10; o PostgreSQL desfaz as duas vendas."},{label:"D",text:"Ficou 9; criar uma view materializada corrige a concorrência."}],correct:0,why:"As duas sessões escreveram o mesmo valor literal 9: uma baixa foi perdida. SELECT ... FOR UPDATE, com leitura sob bloqueio e cálculo subsequente na mesma transação, ou UPDATE produto SET estoque = estoque - 1 WHERE estoque >= 1, impede esse padrão de erro.",hints:["Ambas as sessões calcularam 10 − 1.","Travar a linha ou atualizar o valor atual no próprio UPDATE são duas soluções."],token:"BLOQUEIO",skills:["READ COMMITTED","FOR UPDATE","Atualização atômica"],consequence:"A venda agora respeita a disponibilidade real do produto."},{id:3,title:"O rastro do dinheiro",subtitle:"Triggers e auditoria",icon:"◎",duration:11,context:"O financeiro exige rastreabilidade das mudanças de saldo, mas não quer registros de UPDATEs que não alteram o valor. Uma transferência desfeita não pode aparecer na auditoria confirmada.",objective:"Escolha uma trigger coerente com a auditoria transacional.",evidence:`CREATE TRIGGER auditar_saldo
AFTER UPDATE ON conta

-- A operação também pode executar:
UPDATE conta SET saldo = saldo WHERE conta_id = 1;`,question:"Qual estratégia atende melhor às exigências?",choices:[{label:"A",text:"BEFORE SELECT e gravar sempre em outra conexão."},{label:"B",text:"Criar só um índice na tabela de conta."},{label:"C",text:"AFTER UPDATE, gravar toda atualização inclusive saldo igual e ignorar ROLLBACK."},{label:"D",text:"AFTER UPDATE, verificar OLD.saldo IS DISTINCT FROM NEW.saldo e inserir na auditoria na mesma transação."}],correct:3,why:"OLD/NEW permitem detectar mudanças reais. IS DISTINCT FROM lida inclusive com NULL. A inserção na auditoria participa da mesma transação: um ROLLBACK desfaz tanto a atualização de saldo quanto o registro de auditoria.",hints:["Uma atualização pode escrever a mesma informação anterior.","A auditoria precisa obedecer ao COMMIT/ROLLBACK da operação original."],token:"RASTREIO",skills:["Triggers","OLD / NEW","ROLLBACK"],consequence:"A trilha de auditoria deixou de registrar falsas mudanças e respeita o ROLLBACK."},{id:4,title:"O gargalo invisível",subtitle:"Índices e EXPLAIN",icon:"▥",duration:11,context:"O time recebe reclamações: buscar pedidos pagos de um cliente específico ficou lento com 200 mil pedidos. O sistema ainda não tem índice composto para esse filtro.",objective:"Escolha um índice útil e identifique o alcance do seu prefixo.",evidence:`EXPLAIN (ANALYZE, BUFFERS)
SELECT * FROM pedido
WHERE cliente_id = 1234
  AND status = 'PAGO';

-- Filtros adicionais recorrentes:
-- WHERE cliente_id = 1234
-- WHERE status = 'PAGO'`,question:"Qual índice favorece a consulta de duas colunas e também a busca apenas por cliente_id?",choices:[{label:"A",text:"CREATE INDEX idx ON pedido (status, cliente_id); porque cliente_id é a segunda coluna."},{label:"B",text:"CREATE INDEX idx ON pedido (cliente_id, status); porque cliente_id é o prefixo à esquerda."},{label:"C",text:"CREATE INDEX idx ON pedido (data_pedido); porque a consulta não usa data."},{label:"D",text:"Nenhum índice pode atender filtros compostos."}],correct:1,why:"Para um índice B-tree em (cliente_id, status), filtros pelo prefixo cliente_id podem usar eficientemente o índice, assim como o filtro conjunto. Filtrar apenas status não aproveita o prefixo à esquerda da mesma forma; a escolha efetiva do plano depende de estatísticas, seletividade e custo.",hints:["A ordem das colunas no índice B-tree importa.","A consulta só por cliente_id deve alcançar a primeira coluna do índice."],token:"PREFIXO",skills:["Índice composto","EXPLAIN","ANALYZE"],consequence:"O time propôs uma otimização baseada no padrão de acesso, não apenas em intuição."},{id:5,title:"O painel fantasma",subtitle:"Views, functions e procedures",icon:"▤",duration:11,context:"Às 21h, o financeiro encontra um pedido PAGO recém-inserido, mas o faturamento mensal exibido no painel não mudou. A origem do painel é uma view materializada.",objective:"Escolha como atualizar o painel preservando consultas concorrentes.",evidence:`SELECT * FROM mv_faturamento_mensal
WHERE mes = DATE '2025-12-01';

-- Um novo pedido PAGO foi confirmado.
-- A consulta à view retorna o mesmo total.

-- Existe índice UNIQUE adequado em mes.`,question:"Qual comando resolve a defasagem sem bloquear leituras normais durante o refresh?",choices:[{label:"A",text:"SELECT valor_pedido(1); atualiza automaticamente a view inteira."},{label:"B",text:"COMMIT VIEW mv_faturamento_mensal;"},{label:"C",text:"REFRESH MATERIALIZED VIEW CONCURRENTLY mv_faturamento_mensal;"},{label:"D",text:"CREATE PROCEDURE sem executá-la; isso atualiza a view."}],correct:2,why:"Uma view materializada armazena o resultado anterior e precisa de REFRESH. Com um índice UNIQUE adequado e a view já populada, REFRESH MATERIALIZED VIEW CONCURRENTLY mantém consultas de leitura durante a atualização. Functions e procedures não substituem automaticamente esse refresh.",hints:["A view materializada não é atualizada a cada INSERT na tabela de origem.","O comando desejado começa com REFRESH MATERIALIZED VIEW."],token:"REFRESH",skills:["View materializada","UNIQUE","Functions / procedures"],consequence:"O dashboard voltou a refletir as vendas confirmadas após o refresh."},{id:6,title:"O item clandestino",subtitle:"Validação de estoque e triggers",icon:"⚑",duration:10,context:"Uma integração antiga consegue registrar itens de produtos inativos. O time também notou itens sem preço unitário: a regra precisa estar no banco, não apenas na interface.",objective:"Identifique a trigger correta para impedir itens inválidos antes de serem gravados.",evidence:`-- Produto 7: ativo = false, estoque = 0
-- Produto 2: ativo = true, estoque = 40, preco = 120.00

INSERT INTO item_pedido
  (pedido_id, produto_id, quantidade, preco_unitario)
VALUES (900001, 7, 1, NULL);

-- O pedido 900001 é válido e já existe.`,question:"Que implementação cobre as três regras: produto ativo, quantidade disponível e preço quando vier nulo?",choices:[{label:"A",text:"Uma trigger AFTER DELETE que calcula a média de preço."},{label:"B",text:"Um índice UNIQUE no preco_unitario para impedir itens sem preço."},{label:"C",text:"Uma view comum em item_pedido que só esconda produtos inativos."},{label:"D",text:"Uma trigger BEFORE INSERT por linha que consulta o produto, lança RAISE EXCEPTION para inválido/sem estoque e define NEW.preco_unitario quando nulo."}],correct:3,why:"A trigger BEFORE INSERT tem acesso a NEW antes da gravação, pode rejeitar produtos inexistentes ou inativos, comparar quantidade solicitada com disponível e preencher o preço nulo. A validação de estoque, isoladamente, não substitui controle de concorrência entre vendas simultâneas.",hints:["Uma view não impede gravar registros inválidos na tabela.","Qual momento da trigger permite modificar NEW antes de inserir?"],token:"VALIDACAO",skills:["BEFORE INSERT","NEW","RAISE EXCEPTION"],consequence:"A entrada clandestina foi bloqueada antes de contaminar os pedidos."},{id:7,title:"Transferência de alto risco",subtitle:"Stored procedure e integridade",icon:"◉",duration:10,context:"O financeiro quer centralizar transferências entre contas. Uma chamada tenta enviar R$ 200,00 da conta 1 para a conta 3, mas algumas chamadas seguintes usam valor negativo, destino inexistente e saldo insuficiente.",objective:"Escolha uma procedure que valide a operação antes do débito e mantenha os dois UPDATEs na mesma transação.",evidence:`-- Contas iniciais:
-- conta 1: R$ 1.500,00
-- conta 2: R$   300,00
-- conta 3: R$    50,00

CALL transferir(1, 3, 200);
CALL transferir(1, 99, 200);
CALL transferir(1, 3, -10);`,question:"Qual desenho evita transferência parcial e preserva a consistência?",choices:[{label:"A",text:"Validar valor e contas, bloquear a conta de origem com SELECT FOR UPDATE, verificar saldo e debitar/creditar na mesma transação."},{label:"B",text:"Debitar primeiro e apenas depois conferir destino; registrar erro sem desfazer."},{label:"C",text:"Executar COMMIT dentro de cada UPDATE para salvar o que for possível."},{label:"D",text:"Atualizar só o saldo de origem e deixar o crédito para quando o relatório mensal atualizar."}],correct:0,why:"A procedure deve validar parâmetros, existência das contas e saldo, usar bloqueio ao verificar o saldo e executar débito/crédito como uma única operação transacional. Se houver RAISE EXCEPTION sem captura, a chamada falha e seus efeitos são revertidos. Em cenários concorrentes completos, também é importante pensar no bloqueio de destino e em uma ordem consistente de locks.",hints:["Transferir exige alterar duas contas como uma operação indivisível.","Bloqueie a origem ao ler o saldo e rejeite dados inválidos antes de debitar."],token:"TRANSFERENCIA",skills:["Procedures","FOR UPDATE","RAISE EXCEPTION"],consequence:"A rotina financeira passou a rejeitar chamadas inválidas sem deixar débitos órfãos."},{id:8,title:"A leitura que mudou",subtitle:"Isolamento e anomalias",icon:"◇",duration:6,context:"Uma analista lê o preço do produto 5 e conta os produtos abaixo de R$ 300. Enquanto sua transação continua aberta, outra sessão altera o preço e cadastra um novo produto barato.",objective:"Preveja o comportamento em READ COMMITTED e REPEATABLE READ, distinguindo leitura não repetível e fantasma.",evidence:`-- Estado inicial: produto 5 = R$ 499; COUNT(preco < 300) = 5
-- Sessão A: BEGIN ISOLATION LEVEL READ COMMITTED;
-- A: SELECT preco FROM produto WHERE produto_id = 5; -- 499
-- A: SELECT COUNT(*) FROM produto WHERE preco < 300; -- 5
-- Sessão B: BEGIN;
-- B: UPDATE produto SET preco = 599 WHERE produto_id = 5;
-- B: INSERT INTO produto (...) VALUES (..., 45, ...);
-- B: COMMIT;
-- A repete as duas leituras.`,question:"Qual combinação de resultados e justificativa está correta?",choices:[{label:"A",text:"READ COMMITTED retorna 499 e 5 novamente; REPEATABLE READ retorna 599 e 6."},{label:"B",text:"Os dois níveis retornam 599 e 6, pois B confirmou as alterações."},{label:"C",text:"READ COMMITTED retorna 599 e 6; REPEATABLE READ (iniciado antes do COMMIT de B e com snapshot já estabelecido) conserva 499 e 5."},{label:"D",text:"READ COMMITTED lança erro de serialização automaticamente na segunda leitura."}],correct:2,why:"Em READ COMMITTED cada comando enxerga um snapshot novo, permitindo leitura não repetível e fantasma. Em REPEATABLE READ, estabelecido o snapshot antes da confirmação de B, as leituras subsequentes preservam a mesma visão das linhas. Importante: o snapshot é estabelecido na primeira consulta relevante, não apenas no BEGIN.",hints:["READ COMMITTED cria visões distintas para SELECTs sucessivos.","REPEATABLE READ mantém o snapshot obtido na primeira consulta da transação."],token:"SNAPSHOT",skills:["READ COMMITTED","REPEATABLE READ","Fantasma"],consequence:"A equipe identificou a anomalia de isolamento e definiu quando exigir visão consistente."},{id:9,title:"O estoque reversível",subtitle:"TG_OP e movimentações",icon:"↺",duration:6,context:"O sistema automatizou a baixa e a devolução de estoque por item de pedido. A implementação precisa suportar INSERT e DELETE na mesma função, com histórico coerente e rollback integral.",objective:"Escolha uma implementação transacional que funcione nos dois eventos sem baixa duplicada.",evidence:`CREATE TRIGGER tr_movimenta_estoque
